name: drum_detector
description: Audio-reactive video analysis - detect drum hits and apply visual effects on-device.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  tflite_flutter: ^0.11.0
  fftea: ^1.5.0
  file_picker: ^8.3.6
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_android_video: ^1.3.6
  ffmpeg_kit_flutter_new: ^4.1.0
  path_provider: ^2.1.0
  percent_indicator: ^4.2.3
  permission_handler: ^11.0.0
  share_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
